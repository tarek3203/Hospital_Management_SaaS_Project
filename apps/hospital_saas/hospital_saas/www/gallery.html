{% extends "hospital_saas/templates/site/base.html" %}
{% block content %}
{% autoescape true %}
<div class="page-head"><div class="wrap"><h1>Gallery</h1><p>Inside {{ hospital.company }}</p></div></div>
<section class="block"><div class="wrap grid g3">
	{% for p in photos %}<div class="gallery-img">{% if p.image %}<img src="{{ p.image }}" alt="{{ p.caption }}" />{% endif %}<span>{{ p.caption }}</span></div>
	{% else %}<p>No photos yet.</p>{% endfor %}
</div></section>
{% endautoescape %}
{% endblock %}
